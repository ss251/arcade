<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Same mark as src/marks/arcade-mark.svg. A favicon cannot inherit the page's ink, so the
    scheme is decided here: the app's --ink values, light and dark, nothing else. No plate —
    a tab strip is already a surface, and a coloured square would be a fourth hue.
  -->
  <style>
    :root { color: #211f1c; }
    @media (prefers-color-scheme: dark) { :root { color: #e8e6e1; } }
  </style>
  <path d="M16 8.5 7.5 24.5M16 8.5l8.5 16M11.6 18.6h8.8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="7" r="3.3" fill="currentColor"/>
  <circle cx="7" cy="25" r="3.3" fill="currentColor"/>
  <circle cx="25" cy="25" r="3.3" fill="currentColor"/>
</svg>

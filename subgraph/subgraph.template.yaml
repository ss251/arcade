specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
{{SPLITTER_SOURCES}}
templates:
  - kind: ethereum
    name: FeeSplitterV2
    network: arc-testnet
    source:
      abi: FeeSplitterV2
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/fee-splitter.ts
      entities:
        - Settlement
        - Splitter
        - Tree
        - TreeOccurrence
      abis:
        - name: FeeSplitterV2
          file: ./abis/FeeSplitterV2.json
      eventHandlers:
        - event: Settled(indexed address,uint256,uint256,uint256,indexed bytes32)
          handler: handleSettled
        - event: SettledTree(indexed address,uint256,uint256,uint256,indexed bytes32,indexed bytes32,uint32,uint256)
          handler: handleSettledTree
  - kind: ethereum
    name: IdentityRegistry
    network: arc-testnet
    source:
      abi: IdentityRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/identity.ts
      entities:
        - Agent
        - ListingClaim
        - RegistryEvent
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
        - event: URIUpdated(indexed uint256,string,indexed address)
          handler: handleURIUpdated
        - event: MetadataSet(indexed uint256,indexed string,string,bytes)
          handler: handleMetadataSet
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
  - kind: ethereum
    name: ReputationRegistry
    network: arc-testnet
    source:
      abi: ReputationRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/reputation.ts
      entities:
        - Agent
        - Feedback
        - RegistryEvent
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed string,string,string,string,string,bytes32)
          handler: handleNewFeedback
        - event: FeedbackRevoked(indexed uint256,indexed address,indexed uint64)
          handler: handleFeedbackRevoked
  - kind: ethereum
    name: ValidationRegistry
    network: arc-testnet
    source:
      abi: ValidationRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/validation.ts
      entities:
        - Agent
        - Validation
        - RegistryEvent
      abis:
        - name: ValidationRegistry
          file: ./abis/ValidationRegistry.json
      eventHandlers:
        - event: ValidationRequest(indexed address,indexed uint256,string,indexed bytes32)
          handler: handleValidationRequest
        - event: ValidationResponse(indexed address,indexed uint256,indexed bytes32,uint8,string,bytes32,string)
          handler: handleValidationResponse
  - kind: ethereum
    name: ERC8183
    network: arc-testnet
    source:
      abi: ERC8183
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/escrow.ts
      entities:
        - EscrowJob
        - EscrowEvent
      abis:
        - name: ERC8183
          file: ./abis/ERC8183.json
      eventHandlers:
        - event: "JobCreated(indexed uint256,indexed address,indexed address,address,uint48,address)"
          handler: handleJobCreated
        - event: "ProviderSet(indexed uint256,indexed address,uint256)"
          handler: handleProviderSet
        - event: "PayoutReceiverSet(indexed uint256,indexed address)"
          handler: handlePayoutReceiverSet
        - event: "BudgetSet(indexed uint256,indexed address,uint256)"
          handler: handleBudgetSet
        - event: "JobFunded(indexed uint256,indexed address,uint256)"
          handler: handleJobFunded
        - event: "JobSubmitted(indexed uint256,indexed address,bytes32)"
          handler: handleJobSubmitted
        - event: "JobCompleted(indexed uint256,indexed address,bytes32)"
          handler: handleJobCompleted
        - event: "JobRejected(indexed uint256,indexed address,bytes32)"
          handler: handleJobRejected
        - event: JobExpired(indexed uint256)
          handler: handleJobExpired
        - event: "PaymentReleased(indexed uint256,indexed address,uint256)"
          handler: handlePaymentReleased
        - event: "PlatformFeePaid(indexed uint256,indexed address,uint256)"
          handler: handlePlatformFeePaid
        - event: "EvaluatorFeePaid(indexed uint256,indexed address,uint256)"
          handler: handleEvaluatorFeePaid
        - event: "Refunded(indexed uint256,indexed address,uint256)"
          handler: handleRefunded
        - event: "Settled(indexed uint256,uint256,uint256)"
          handler: handleSettled
  - kind: ethereum
    name: ArcadeJobHook
    network: arc-testnet
    source:
      abi: ArcadeJobHook
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/escrow-hook.ts
      entities:
        - EscrowJob
        - EscrowEvent
        - Settlement
      abis:
        - name: ArcadeJobHook
          file: ./abis/ArcadeJobHook.json
      eventHandlers:
        - event: "ArcadeSettled(indexed uint256,bytes32,uint32,uint256,bytes32)"
          handler: handleArcadeSettled
          receipt: true
        - event: "ArcadeRefused(indexed uint256,bytes32)"
          handler: handleArcadeRefused

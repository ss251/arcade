[profile.default]
src = "contracts"
test = "contracts/test"
out = "contracts/out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "erc8183/=lib/erc8183/contracts/",
    "@openzeppelin/contracts/=lib/erc8183/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/erc8183/lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/erc8183/lib/forge-std/src/",
]
# Arc testnet
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

# Candidate escrow build, isolated from existing artifacts. This pinned
# implementation still exceeds EIP-170; a passing test is NOT deployment approval.
[profile.erc8183]
via_ir = true
out = "contracts/out/erc8183"
cache_path = "cache/erc8183"
